<!DOCTYPE html>
<html lang="en">
<head>
    <m

                <nav id="creation-nav">
                    <button data-step="characteristics">Characteristics</button>
                    <button data-step="career">Career</button>
                    <button data-step="background">Background</button>
                    <button data-step="obligation">Obligation</button>
                    <button data-step="skills">Skills</button>
                    <button data-step="talents">Talents</button>
                    <button data-step="equipment">Equipment</button>

                <section id="builder-content">

                <h2>Character</h2>

                <div id="character-name">

                    <input

                        id="name"
                        name="name"

                </div>

                <hr>

                <div id="summary-background">
                    <strong>Background:</strong>

                <div id="summary-career">

                </div>

                <hr>

                <div id="summary-xp">
                    <strong>XP Remaining:</strong>
                    <span>110</span>
                </div>

                <div id="summary-obligation">
                    <strong>Obligation:</strong>
                    <span>10</span>
                </div>

                <div id="summary-wealth">
                    <strong>Silver Stags:</strong>
                    <span>1,000</span>
                </div>

            </aside>

        </div>

    </main>

    <script src="js/data.js"></script>
